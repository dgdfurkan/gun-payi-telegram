<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Panelsiz dikte · sentetik olay kontrolü</title><link rel="stylesheet" href="/style.css"><style>body{padding:30px;max-width:900px;margin:auto}button{margin:7px}label{margin:20px 0}section{border-top:1px solid #ddd;padding-top:20px;margin-top:25px}output{display:block;padding:15px;background:#f6f2fa;white-space:pre-wrap}h1{font-size:24px}p{margin:15px 0}</style></head><body><h1>Panelsiz dikte — test fikstürü</h1><p>Buradaki ses sonuçları sentetiktir. Mikrofon veya tanıma doğruluğu test edilmez.</p><form id="test-form"><label>Test görev alanı<input id="test-field" maxlength="500" value="Önceki metin."></label><div id="mic-slot"></div><button id="save" class="button primary" type="submit">Ekle</button></form><section><button type="button" id="interim" class="button secondary">Geçici Türkçe sonuç</button><button type="button" id="repeat" class="button secondary">Aynı sonucu tekrarla</button><button type="button" id="overflow" class="button secondary">Uzun sonuç</button><button type="button" id="deny" class="button secondary">İzin reddi</button></section><label>Kaydedilen sonuç<output id="saved"></output></label><output id="details"></output><script type="module">
import {setupVoice,voiceButton} from '/voice.js';
let rec;class FakeRecognition{constructor(){rec=this}start(){this.onstart?.()}stop(){const r=Object.assign([{transcript:'İstanbul’a yarın gideceğim.'}],{isFinal:true});this.onresult?.({results:[r]});this.onend?.()}abort(){this.aborted=true}}
window.SpeechRecognition=FakeRecognition;document.querySelector('#mic-slot').innerHTML=voiceButton('#test-field');const voice=setupVoice({onRecover:text=>document.querySelector('#details').textContent='Kurtarılan: '+text});const emit=()=>rec?.onresult?.({results:[Object.assign([{transcript:'İstanbul’a yarın'}],{isFinal:false})]});document.querySelector('#interim').onclick=emit;document.querySelector('#repeat').onclick=emit;document.querySelector('#overflow').onclick=()=>rec?.onresult?.({results:[Object.assign([{transcript:'Çok uzun '.repeat(100)}],{isFinal:true})]});document.querySelector('#deny').onclick=()=>rec?.onerror?.({error:'not-allowed'});document.querySelector('#test-form').onsubmit=async e=>{e.preventDefault();await voice.finishFor(e.target);document.querySelector('#saved').textContent=document.querySelector('#test-field').value;document.querySelector('#details').textContent=JSON.stringify({lang:rec?.lang,aborted:Boolean(rec?.aborted),dialogs:document.querySelectorAll('dialog').length})};
</script></body></html>
