<!doctype html><html lang="tr"><meta charset="utf-8"><title>Gün Payı mobil kontrol</title><style>body{margin:0;background:#ece9f1;font:14px system-ui;display:flex;gap:20px;padding:12px}iframe{width:390px;height:844px;border:0;border-radius:16px;background:white}aside{max-width:460px}button{padding:11px;margin:4px}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;max-width:450px;font-size:12px}</style><iframe id="phone" src="/" title="Mobil önizleme"></iframe><aside><h1>Yerel test kontrolü</h1><p>Ses ve Telegram sonuçları sahtedir; gerçek ses veya mesaj gönderimi yapılmaz.</p><button id="narrow">320 px</button><button id="wide">390 px</button><button id="inspect">Yerleşimi kontrol et</button><button id="mock">Sahte ses motorunu bağla</button><button id="hidden">İzin penceresi açıldı</button><button id="visible">İzin penceresinden dön</button><button id="started">Ses servisini başlat</button><button id="audio">Ses yakalamayı başlat</button><button id="speak">Türkçe sonuç gönder</button><button id="fake-api">Sahte Telegram servisini bağla</button><button id="queue">Telegram değişikliklerini hazırla</button><output id="result"></output></aside><script type="module">
const frame=document.getElementById('phone'),out=document.getElementById('result');let rec,hidden=false,pending=false,seen=false,lastCalendar,requests=0;const d=()=>frame.contentDocument,w=()=>frame.contentWindow;
document.getElementById('narrow').onclick=()=>frame.style.width='320px';document.getElementById('wide').onclick=()=>frame.style.width='390px';document.getElementById('inspect').onclick=()=>out.textContent=JSON.stringify({width:d().documentElement.clientWidth,scrollWidth:d().documentElement.scrollWidth,voice:d().querySelector('[data-voice-target]')?.outerHTML,field:d().querySelector('#quick-title')?.value,nav:[...d().querySelectorAll('.mobile-nav button')].map(x=>x.textContent||x.getAttribute('aria-label')),requests,mirroredPlans:lastCalendar?.items?.length,notesInMirror:Boolean(lastCalendar?.notes)},null,2);
document.getElementById('mock').onclick=()=>{w().SpeechRecognition=class{constructor(){rec=this}start(){this.waiting=true}stop(){this.onresult?.({results:[Object.assign([{transcript:'Sabah yürüyüşü yapacağım.'}],{isFinal:true})]});this.onend?.()}abort(){this.aborted=true}};out.textContent='Sahte ses motoru hazır';};
document.getElementById('hidden').onclick=()=>{hidden=true;Object.defineProperty(d(),'hidden',{configurable:true,get:()=>hidden});d().dispatchEvent(new Event('visibilitychange'));out.textContent='İzin penceresi: uygulama görünmez, mikrofon henüz başlamadı';};document.getElementById('visible').onclick=()=>{hidden=false;d().dispatchEvent(new Event('visibilitychange'));out.textContent='Uygulama yeniden görünür';};document.getElementById('started').onclick=()=>{rec?.onstart?.();out.textContent='Ses servisi başladı, henüz audio-start gelmedi';};document.getElementById('audio').onclick=()=>{rec?.onaudiostart?.();out.textContent='Audio-start geldi';};document.getElementById('speak').onclick=()=>{rec?.onresult?.({results:[Object.assign([{transcript:'Sabah yürüyüşü'}],{isFinal:false})]});out.textContent='Türkçe metin gönderildi; aborted='+rec?.aborted;};
document.getElementById('fake-api').onclick=()=>{const original=w().fetch.bind(w());w().fetch=async(input,opts={})=>{const url=String(input);if(url==='/telegram-config.json')return new (w().Response)(JSON.stringify({serviceUrl:'https://demo-gun-payi.workers.dev'}),{headers:{'content-type':'application/json'}});if(!url.startsWith('https://demo-gun-payi.workers.dev/'))return original(input,opts);requests++;const path=new URL(url).pathname.replace(/^\/bot\/123456/,''),body=opts.body?JSON.parse(opts.body):{};let data={ok:true};if(path==='/api/identify')data={ok:true,users:[{userId:'100001',name:'Furkan (yerel test)'}]};if(path==='/api/configure')data={ok:true,botId:'123456',deviceKey:'fake-device-key',userId:'100001',botUsername:'fake_gunpayi_bot',chatName:'Yerel test'};if(path==='/api/sync'){lastCalendar=body.calendar;if(pending&&!seen){const now=new Date().toISOString(),date=new Intl.DateTimeFormat('en-CA').format(new Date());data={pending:true,cursor:2,events:[{seq:1,type:'add',item:{id:'telegram-qa-plan',title:'Telegram’dan spor planı',date,time:'18:00',endTime:'',kind:'event',repeat:'none',weekdays:[],area:'personal',icon:'fitness',optional:true,priority:false,status:'pending',buffer:0,exceptions:{},history:[],detail:'',createdAt:now,updatedAt:now}},{seq:2,type:'note',note:{id:'telegram-qa-note',text:'Telegram’dan gelen test notu',kind:'remember',tag:'Telegram',recall:'',use:'',reviewDates:[],reviewedDates:[],createdAt:now,updatedAt:now}}]};seen=true;}else data={ok:true,pending:false,cursor:seen?2:0,connected:true,lastSync:new Date().toISOString(),nextAlarm:Date.now()+60000,botUsername:'fake_gunpayi_bot'};}if(path==='/api/status')data={ok:true,connected:true,lastSync:new Date().toISOString(),nextAlarm:Date.now()+60000,botUsername:'fake_gunpayi_bot'};if(path==='/api/test')data={ok:true,due:Date.now()+60000};return new (w().Response)(JSON.stringify(data),{headers:{'content-type':'application/json'}});};w().dispatchEvent(new (w().Event)('online'));out.textContent='Sahte API etkin; gerçek Telegram ağına istek gönderilmeyecek';};document.getElementById('queue').onclick=()=>{pending=true;seen=false;out.textContent='Bir görev ve bir not bekliyor';};
</script></html>
