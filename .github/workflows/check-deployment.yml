name: Canlı kontrol
# Cloudflare, main'e her push'ta Worker'ı kendi derler. Bu iş yayın bitince sürümü ve uygulamayı denetler.
on:
  push:
    branches: [main]
    paths: ["web/**", "worker/**", "wrangler.jsonc", "package.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Sağlık, sürüm ve uygulama kabuğu
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base = 'https://gun-payi-telegram.frkngndz60.workers.dev'
          want = json.load(open('package.json'))['version']
          ua = {'User-Agent': 'Gun-Payi-Check', 'Cache-Control': 'no-cache'}
          health = None
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + '/health', headers=ua), timeout=20) as r:
                      health = json.load(r)
                  if health.get('version') == want:
                      break
              except Exception as e:
                  health = {'error': str(e)}
              time.sleep(10)
          print('HEALTH=' + json.dumps(health, ensure_ascii=False))
          assert health.get('service') == 'gun-payi', 'Servis yanıtı beklenen gibi değil'
          assert health.get('version') == want, 'Canlı sürüm ' + str(health.get('version')) + ', beklenen ' + want
          assert health.get('alarm') is True, 'Durable Object bağlı değil'
          with urllib.request.urlopen(urllib.request.Request(base + '/', headers=ua), timeout=20) as r:
              html = r.read().decode()
          assert 'manifest.webmanifest' in html and '/js/app.js' in html, 'Uygulama kabuğu sunulmuyor'
          print('BOT=' + str(health.get('bot')).lower(), 'AI=' + str(health.get('ai')).lower())
          PY
