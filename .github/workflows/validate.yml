name: Doğrula
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund
      - name: Sözdizimi
        run: npm run check
      - name: Testler (çözümleyici, uygulama, Worker)
        run: npm test
      - name: Cloudflare paketleme denemesi
        run: npx wrangler deploy --dry-run --outdir /tmp/gun-payi-check
